name: Build Apaajalahh - ZapFast Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zapfast.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify ZapFast v0.19.0 portable release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'zapfast-v0.19.0-x86_64-pc-windows-msvc.zip'
          $url = "https://github.com/crmne/zapfast/releases/download/v0.19.0/$name"
          $expected = '389d1456f258977fdf3c6d93da441d925d6e33ca7a5039a5b0159a0c000bad37'
          Invoke-WebRequest -Uri $url -OutFile $name
          $actual = (Get-FileHash -Algorithm SHA256 -Path $name).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch: expected $expected but got $actual"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $name))
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.ToLowerInvariant() })
            foreach ($needed in @('zapfast.exe', 'license', 'third-party-notices.md')) {
              if (-not ($entries | Where-Object { $_.EndsWith($needed) })) {
                throw "Official archive missing $needed"
              }
            }
          }
          finally { $zip.Dispose() }
          Copy-Item -Path $name -Destination 'Apaajalahh-ZapFast-v0.19.0-win-x64.zip'
          Write-Host "Verified original upstream SHA256: $actual"

      - name: Upload verified Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Apaajalahh-ZapFast-win-x64
          path: Apaajalahh-ZapFast-v0.19.0-win-x64.zip
          compression-level: 0
          if-no-files-found: error
