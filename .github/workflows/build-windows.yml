name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64 (self-contained)
        shell: pwsh
        run: dotnet publish desktop/WANativeLite.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -o out
      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath WA-Native-Lite-win-x64.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-Native-Lite-win-x64
          path: WA-Native-Lite-win-x64.zip
          if-no-files-found: error
